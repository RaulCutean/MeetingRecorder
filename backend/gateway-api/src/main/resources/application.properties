spring.application.name=gateway-api
server.port=8080

# Routes: single entry point for the Angular client. JWT validation will be added as a filter later.
spring.cloud.gateway.server.webmvc.routes[0].id=user-api
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_API_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/teams/**

spring.cloud.gateway.server.webmvc.routes[1].id=meeting-api
spring.cloud.gateway.server.webmvc.routes[1].uri=${MEETING_API_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/meetings/**

spring.cloud.gateway.server.webmvc.routes[2].id=task-api
spring.cloud.gateway.server.webmvc.routes[2].uri=${TASK_API_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tasks/**,/api/proposals/**

# CORS
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
