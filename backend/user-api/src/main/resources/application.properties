spring.application.name=user-api
server.port=8081

# Database: shared PostgreSQL, this service works only in its own schema
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meeting_recorder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Early stage: Hibernate manages the tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=user_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:meetingrecorder}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:meetingrecorder}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
